<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Orbital Planter</title>
  </head>
  <body>
    <main>
      <aside aria-label="Model controls">
        <section aria-label="Finish">
          <div class="swatches" role="group" aria-label="Preview finish">
            <button
              class="swatch active"
              data-color="#d8d3c6"
              style="--swatch: #d8d3c6"
              aria-label="Chalk finish"
              aria-pressed="true"
            ></button>
            <button
              class="swatch"
              data-color="#f2f0e9"
              style="--swatch: #f2f0e9"
              aria-label="Porcelain finish"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-color="#c5a780"
              style="--swatch: #c5a780"
              aria-label="Sand finish"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-color="#9ba68f"
              style="--swatch: #9ba68f"
              aria-label="Sage finish"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-color="#b96f53"
              style="--swatch: #b96f53"
              aria-label="Clay finish"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-color="#536b83"
              style="--swatch: #536b83"
              aria-label="Slate blue finish"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-color="#662d3e"
              style="--swatch: #662d3e"
              aria-label="Burgundy finish"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-color="#44474a"
              style="--swatch: #44474a"
              aria-label="Graphite finish"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-color="#080808"
              style="--swatch: #080808"
              aria-label="Deep black finish"
              aria-pressed="false"
            ></button>
          </div>
        </section>
        <section class="background-control" aria-label="Viewer background">
          <div class="material-label">Background</div>
          <div
            class="background-options segmented-control"
            role="group"
            aria-label="Background mode"
          >
            <button data-background="auto" class="active" aria-pressed="true">
              Auto
            </button>
            <button data-background="dark" aria-pressed="false">Dark</button>
            <button data-background="light" aria-pressed="false">Light</button>
          </div>
        </section>
        <section class="plant-control" aria-label="Plant preview">
          <div class="material-label" id="plant-label">Plant</div>
          <div class="plant-picker" id="plant-picker"></div>
        </section>
        <div class="downloads">
          <a class="download" href="/models/orbital-planter.zip" download
            ><svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3v12m-4-4 4 4 4-4" />
              <path d="M5 15v5h14v-5" /></svg
            ><span>Download STL files</span></a
          >
        </div>
      </aside>
      <div class="studio" data-background="dark">
        <div
          id="viewport"
          aria-label="Interactive 3D planter. Drag to orbit, scroll to zoom."
        >
          <div id="loading" role="status">Preparing your object…</div>
        </div>
        <div
          class="view-tabs segmented-control"
          role="group"
          aria-label="Model view"
        >
          <button data-view="assembled" class="active" aria-pressed="true">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z" />
              <path d="m4 7.5 8 4.5 8-4.5M12 12v9" /></svg
            ><span>Assembled</span>
          </button>
          <button data-view="exploded" aria-pressed="false">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m12 3 9 5-9 5-9-5 9-5Z" />
              <path d="m3 12 9 5 9-5M3 16l9 5 9-5" /></svg
            ><span>Exploded</span>
          </button>
          <button data-view="section" aria-pressed="false">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 3v18m0-14 5 5-5 5" /></svg
            ><span>Cutaway</span>
          </button>
        </div>
        <div class="viewer-tools">
          <button
            id="rotate"
            aria-pressed="false"
            title="Toggle automatic rotation"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 7v5h-5" />
              <path d="M4.9 17a8 8 0 1 1 14.7-8.3L20 12" /></svg
            ><span>Rotate</span></button
          ><button id="reset" title="Reset camera">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
              <circle cx="12" cy="12" r="3" /></svg
            ><span>Reset view</span>
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
